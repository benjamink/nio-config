# Bootable Workbench 1.3 floppy with the FujiNet NIO drivers and Config.
# The base disk is the user's own licensed Workbench 1.3.3 floppy (not in this
# repository); pass it with BASE_ADF=.  It is almost full, so the parts of
# Workbench the FujiNet does not need are removed to make room.  Mount and
# FastFileSystem stay: FMOUNT on 1.3 starts its drives through Mount, and the
# DN/HN drives need FastFileSystem.
#
# Paths below use the base disk's exact letter case (devs, libs, c, l, s).

name = "wb13"
description = "Workbench 1.3 (Kickstart 1.3, e.g. A500, A2000)"
base_volume = "Workbench1.3"
# amiga-os-134-workbench.adf (Amiga Forever "Workbench1.3" disk)
base_sha256 = "f732c9ab42516ae721784e1893a35d9afed1fe15fd801aa16f4bc1663ea44758"
output = "FujiNet-WB13-Boot.adf"
min_free_bytes = 4096

delete = [
  "devs/narrator.device", "devs/printer.device", "devs/parallel.device",
  "devs/ramdrive.device", "l/Speak-Handler", "libs/translator.library",
  "devs/keymaps/cdn", "devs/keymaps/ch1", "devs/keymaps/ch2",
  "devs/keymaps/d", "devs/keymaps/dk", "devs/keymaps/e", "devs/keymaps/f",
  "devs/keymaps/gb", "devs/keymaps/i", "devs/keymaps/n", "devs/keymaps/s",
  "c/Edit", "c/DiskDoctor",
  "System/DiskCopy", "System/DiskCopy.info", "System/InitPrinter",
  "System/InitPrinter.info", "System/MergeMem", "System/MergeMem.info",
  "System/NoFastMem", "System/NoFastMem.info", "System/FixFonts",
  "System/FixFonts.info",
  "Utilities/CMD", "Utilities/Cmd.info", "Utilities/GraphicDump",
  "Utilities/GraphicDump.info", "Utilities/InstallPrinter",
  "Utilities/InstallPrinter.info", "Utilities/Notepad",
  "Utilities/Notepad.info", "Utilities/PrintFiles",
  "Utilities/PrintFiles.info", "Utilities/Say", "Utilities/Say.info",
  "fonts/diamond.font", "fonts/emerald.font", "fonts/garnet.font",
  "fonts/opal.font", "fonts/ruby.font", "fonts/sapphire.font",
]
delete_dirs = [
  "devs/printers", "fonts/diamond", "fonts/emerald", "fonts/garnet",
  "fonts/opal", "fonts/ruby", "fonts/sapphire",
]

# config-nio comes from CONFIG_NIO= (the built wb13 binary), plus its icons.
config_nio_dst = "Tools/config-nio"
tool_icon = "config-nio.info"
desktop_file = "ConfigNIO"
desktop_icon = "FujiNet-Config.info"

# Text edits to the base disk's startup files.
[[edit]]
file = "s/StartupII"
remove = ["Mount SPEAK: ;just mounting doesn't take much ram at all"]
before = "Break 1 C ;signal to other process it's OK to finish"
insert = [
  "C:fujinet-load-resident DEVS:fujinet-nio.device fujinet-nio.device",
  "C:fujinet-load-resident DEVS:fujinet-disk.device fujinet-disk.device",
]

# Start Config once Workbench is up.
[[edit]]
file = "s/Startup-Sequence"
before = "EndCLI >NIL:"
insert = ["Run >NIL: SYS:Tools/config-nio"]

# The FujiNet drive entries (DN/HN/DO/HO) join the disk's own MountList.
[[append]]
src = "MountList-FujiNet-WB13"
dst = "devs/MountList"

[[package]]
src = "fujinet-nio.device"
dst = "devs/fujinet-nio.device"
[[package]]
src = "fujinet-disk.device"
dst = "devs/fujinet-disk.device"
[[package]]
src = "fujinet-load-resident"
dst = "c/fujinet-load-resident"
[[package]]
src = "fmount"
dst = "c/fmount"
[[package]]
src = "fumount"
dst = "c/fumount"
