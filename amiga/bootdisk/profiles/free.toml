# Freely distributable FujiNet boot floppy: no Workbench, no Commodore or
# Cloanto files.  Everything on the disk is this project's own code, including
# the boot block.  One disk boots on every Kickstart from 1.3: the ROM supplies
# exec, dos, intuition and graphics, and the ROM shell runs the plain
# commands below, so the disk boots straight into FujiNet Config.
#
# Built from scratch, so no BASE_ADF is needed.
#
# What a bare system needs that a Workbench one hides:
# - Stock serial.device is a Workbench file (Devs:), so the disk loads the
#   project's own fujinet-serial.device and selects it with fujinet-nio-serial.
# - The Workbench 3.x tools are built with clib2, whose startup crashes without
#   a Workbench startup.  fmount, fumount, fujinet-nio-serial and
#   fujinet-nio-baud are rebuilt
#   against the 2.0 headers and linked with the libnix nix13 runtime (like
#   config-nio): `make amiga-bootdisk-tools`.  fmount and fumount pick their
#   path at run time: Kickstart 1.3 gets the OFS drives DO0:/DO1:/HO0:/HO1:
#   (built without C:Mount), 2.0+ the dynamic DN0:-DN7: drives.
# - Kickstart 1.3 Execute() needs C:Run (a Workbench file); config-nio runs
#   fmount/fumount inside its own process there.  Config runs in the boot CLI,
#   which stays open.
# - fmountrestore is left off: on a bare system it crashed when no FujiNet
#   answered, so saved drives are not remounted at boot; mount from Config.
# - The RS-232 rate is 38400, verified on Kickstart 1.3 and 3.1 (stock and
#   PiStorm; PiStorm on 1.3 needs Zorro II RAM).  The FujiNet must match.  To
#   use another rate, change the fujinet-nio-baud line in S/Startup-Sequence.

name = "free"
description = "FujiNet NIO + Config boot disk, no Workbench (Kickstart 1.3 and 2.0+)"
scratch = true
volume = "FujiNet"
output = "FujiNet-Free-Boot.adf"
min_free_bytes = 65536
dirs = ["C", "Devs", "S", "Tools"]
config_nio_dst = "Tools/config-nio"

startup_sequence = """; FujiNet NIO boot disk: load the drivers and run Config.
C:fujinet-load-resident DEVS:fujinet-nio.device fujinet-nio.device
; Stock serial.device is a Workbench file, not in ROM, and is not on this disk:
; use the project's own Paula UART driver for the RS-232 link instead.
C:fujinet-load-resident DEVS:fujinet-serial.device fujinet-serial.device
C:fujinet-nio-serial fujinet-serial.device
C:fujinet-load-resident DEVS:fujinet-disk.device fujinet-disk.device
; The FujiNet must use the same rate: on its console, uart.baud 38400 then
; uart.save.  Edit this line to use another rate.
C:fujinet-nio-baud 38400
Tools/config-nio
"""

[[package]]
src = "fujinet-nio.device"
dst = "Devs/fujinet-nio.device"
[[package]]
src = "fujinet-disk.device"
dst = "Devs/fujinet-disk.device"
[[package]]
src = "fujinet-serial.device"
dst = "Devs/fujinet-serial.device"
[[package]]
src = "fujinet-nio-serial"
dst = "C/fujinet-nio-serial"
from = "tools"
[[package]]
src = "fujinet-nio-baud"
dst = "C/fujinet-nio-baud"
from = "tools"
[[package]]
src = "fujinet-load-resident"
dst = "C/fujinet-load-resident"
[[package]]
src = "fmount"
dst = "C/fmount"
from = "tools"
[[package]]
src = "fumount"
dst = "C/fumount"
from = "tools"
