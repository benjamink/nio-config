# The shared cc65-clib harness with a larger zero-page area: this fixture
# links the real composer's zero-page arguments alongside the C reference.
FEATURES { STARTADDRESS: default = $1900; }
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0800;
    __STACKSTART__: type = weak, value = $8000;
    __HIMEM__: type = weak, value = $7200;
}
MEMORY {
    ZP: start = $0050, size = $0040, type = rw, define = yes;
    HARNESS: start = $1900, size = $5900, file = %O;
    PRINT_BUF: start = $C800, size = $0300, file = "";
    MOS_VECTORS_M: start = $FFB9, size = 65, file = %O, define = no;
    V_IRQ_M: start = $FFFE, size = 2, file = %O, define = no;
    V_RST: start = $FFFC, size = 2, file = %O, define = no;
}
FILES { %O: format = atari; }
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    STARTUP: load = HARNESS, type = rw;
    LOWCODE: load = HARNESS, type = rw, optional = yes;
    CODE: load = HARNESS, type = rw;
    ONCE: load = HARNESS, type = ro, optional = yes;
    RODATA: load = HARNESS, type = rw;
    DATA: load = HARNESS, type = rw, define = yes;
    BSS: load = HARNESS, type = bss, define = yes;
    MOS_VECTORS: load = MOS_VECTORS_M, type = ro;
    V_IRQ: load = V_IRQ_M, type = ro;
    V_RESET: load = V_RST, type = ro;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor, label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__, segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__,
            count = __INTERRUPTOR_COUNT__, segment = RODATA, import = __CALLIRQ__;
}
