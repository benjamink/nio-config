FEATURES {
    STARTADDRESS: default = $4000;
}
SYMBOLS {
    _bank_select_setup: type = import;
    _bank_select_main: type = import;
    __BASICOFF__:        type = import;   # first load chunk: switches the BASIC ROM off
    __STACKSIZE__:       type = weak,   value = $0180;
    __STARTADDRESS__:    type = export, value = %S;
    __RESERVED_MEMORY__: type = weak,   value = $0000;
}
MEMORY {
    ZP:   file = "", define = yes, start = $0082, size = $007E;
    BASICCHNK: file = %O, start = $2E00, size = $0040;
    # $0650-$0BFF: page 6 after the display list, and the pages PicoBoot's loader
    # used (dead once the program runs).  Buffers that need no initial value live here.
    LOWRAM: file = "", define = yes, start = $0650, size = $05B0;
    MAIN: file = %O, define = yes, start = %S, size = $4000 - %S;
    HIGH: file = %O, define = yes, start = $8000,
          size = $BC00 - __STACKSIZE__ - __RESERVED_MEMORY__ - $8000;
    BANK: file = %O, define = yes, start = $4000, size = $4000;
    SETUPBANK: file = %O, define = yes, start = $4000, size = $4000;
}
FILES {
    %O: format = atari;
}
FORMATS {
    atari: runad = start,
           initad = BASICCHNK: __BASICOFF__,
           initad = BANK: _bank_select_setup,
           initad = SETUPBANK: _bank_select_main;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    EXTZP:    load = ZP,   type = zp,                optional = yes;
    BASICOFF: load = BASICCHNK, type = ro, optional = no;
    LOWMEM:   load = LOWRAM, type = bss, optional = yes;
    STARTUP:  load = MAIN, type = ro,  define = yes;
    LOWBSS:   load = MAIN, type = rw,                optional = yes;
    LOWCODE:  load = MAIN, type = ro,  define = yes, optional = yes;
    ONCE:     load = MAIN, type = ro,                optional = yes;
    CODE:     load = MAIN, type = ro,  define = yes;
    TAB_HOSTS:  load = BANK, type = ro, define = yes;
    TAB_BROWSE: load = BANK, type = ro, define = yes;
    TAB_DRIVES: load = BANK, type = ro, define = yes;
    TAB_SETUP:  load = SETUPBANK, type = ro, define = yes;
    RESIDENT_HIGH: load = HIGH, type = ro, define = yes;
    COMMON_HIGH: load = HIGH, type = ro, define = yes;
    RODATA:   load = HIGH, type = ro;
    DATA:     load = HIGH, type = rw;
    INIT:     load = HIGH, type = bss, define = yes, optional = yes;
    BSS:      load = HIGH, type = bss, define = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
