# config-nio on the C64. As cc65's stock c64.cfg, with three changes:
#  - the zero page is the whole of BASIC's ($02-$8F): BASIC is banked out by the
#    startup code and never returned to as it was (the app leaves through the reset
#    vector, or c64_run.s, which sets BASIC up again), and the app's assembly passes
#    arguments in zero page;
#  - the named segments the shared app and core place code in (the Atari's banked
#    build needs them apart) all land in main memory;
#  - LOWMEM, which the app and core use for buffers nothing clears, is ordinary
#    uninitialised memory after BSS.
FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0800; # 2k stack
    __HIMEM__:     type = weak, value = $D000;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $008E;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = __HIMEM__ - __HEADER_LAST__;
    BSS:      file = "",               start = __ONCE_RUN__,    size = __HIMEM__ - __STACKSIZE__ - __ONCE_RUN__;
}
SEGMENTS {
    ZEROPAGE:    load = ZP,       type = zp;
    LOADADDR:    load = LOADADDR, type = ro;
    EXEHDR:      load = HEADER,   type = ro;
    STARTUP:     load = MAIN,     type = ro;
    LOWCODE:     load = MAIN,     type = ro,  optional = yes;
    CODE:        load = MAIN,     type = ro;
    TAB_HOSTS:   load = MAIN,     type = ro,  optional = yes;
    TAB_BROWSE:  load = MAIN,     type = ro,  optional = yes;
    TAB_DRIVES:  load = MAIN,     type = ro,  optional = yes;
    TAB_SETUP:   load = MAIN,     type = ro,  optional = yes;
    COMMON_HIGH: load = MAIN,     type = ro,  optional = yes;
    RODATA:      load = MAIN,     type = ro;
    DATA:        load = MAIN,     type = rw;
    INIT:        load = MAIN,     type = rw;  # uninitialized, but reserves output space
    ONCE:        load = MAIN,     type = ro,  define = yes;
    BSS:         load = BSS,      type = bss, define = yes;
    LOWMEM:      load = BSS,      type = bss, optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
